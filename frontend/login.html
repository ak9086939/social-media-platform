<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - SocialApp</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <header class="navbar">

        <h1>SocialApp</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <main class="form-container">

        <h2>Login</h2>


        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
