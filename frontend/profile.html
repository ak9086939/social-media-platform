<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Profile - SocialApp
    </title>


    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- ===============================
         NAVBAR
    ================================ -->

    <header class="navbar">


        <h1>
            SocialApp
        </h1>


        <nav
            id="nav-links">

        </nav>


    </header>


    <!-- ===============================
         PROFILE
    ================================ -->

    <main
        class="profile-container">


        <!-- Profile Information -->

        <section
            id="profile-info"
            class="profile-card">


            Loading Profile...


        </section>

        <!-- Followers / Following List -->

        <section
            id="user-list-section"
            class="user-list-section">

        </section>


        <!-- User Posts -->

        <section
            class="user-posts-section">


            <h2>

                User Posts

            </h2>


            <div
                id="posts-container">


                Loading Posts...


            </div>


        </section>


    </main>


    <!-- JavaScript -->

    <script
        src="js/profile.js">

    </script>


</body>


</html>
