<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - SocialApp</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <header class="navbar">

        <h1>SocialApp</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="form-container">

        <h2>Create Account</h2>


        <form id="register-form">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >


            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p id="message"></p>


        <p>
            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
